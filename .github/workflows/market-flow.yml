name: Archive public market-flow snapshots

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-flow-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install httpx pandas
      - name: Fetch public snapshots
        run: python flow_collector.py
      - name: Commit observed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flow/*.jsonl
          if ls data/signals/*.jsonl >/dev/null 2>&1; then git add data/signals/*.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: market flow hourly snapshot"
            git push
          else
            echo "No new hourly observations"
          fi
