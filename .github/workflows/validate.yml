name: Validate Pre-Pump Scanner V3
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py accuracy.py validation_v3.py market_flow.py flow_collector.py flow_history.py signal_capture.py signal_core.py signal_archive.py confirmation.py simple_view.py mexc_fast.py mexc_velocity.py mexc_early.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
