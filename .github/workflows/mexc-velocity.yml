name: MEXC five-minute price acceleration watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Get all MEXC Futures prices and calculate acceleration
        run: python mexc_velocity.py
      - name: Commit updated snapshot and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mexc_velocity/history.json data/mexc_velocity/latest.json data/mexc_velocity/latest_early.json data/mexc_velocity/latest_quality.json
          if ls data/mexc_quality/*.jsonl >/dev/null 2>&1; then git add data/mexc_quality/*.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh MEXC fast movers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
