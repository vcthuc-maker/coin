name: MEXC five-minute price acceleration watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mexc-velocity.yml'

permissions:
  contents: write

concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect all-market MEXC Radar snapshots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mexc_radar.py --once
      - name: Legacy detailed scanners (non-blocking)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mexc_velocity.py
      - name: Commit updated snapshot and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/mexc_radar
          git add -A data/mexc_velocity
          if ls data/mexc_quality/*.jsonl >/dev/null 2>&1; then git add data/mexc_quality/*.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh MEXC fast movers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
